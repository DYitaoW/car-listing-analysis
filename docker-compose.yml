services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: listing
      POSTGRES_PASSWORD: listing
      POSTGRES_DB: listing_validator
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # Optional local vision model — requires GPU host support for useful speed
  # ollama:
  #   image: ollama/ollama:latest
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama:/root/.ollama

volumes:
  pgdata:
